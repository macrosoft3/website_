[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77", "wheel" ]

[project]
name = "ether"
version = "0.1.0"
description = "Organization website for Ether LLC"
readme = "README.md"
license = { text = "Not open source" }
authors = [
  { name = "Ether LLC", email = "so.masuda.2003@ether-llc.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "django>=6.0.6",
]

[dependency-groups]
dev = [
  "djlint==1.39.2",
  "pytest==9.1",
  "pytest-django==4.12",
  "ruff==0.15.17",
]

[tool.setuptools]
packages.find.include = [ "config", "ether" ]

[tool.ruff]
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
  "tmp/*",
]
lint.select = [
  "A",
  "B",
  "C4",
  "DJ",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "Q",
  "RET",
  "RUF",
  "S",
  "SIM",
  "TRY",
  "UP",
  "W",
]
lint.ignore = [
  "RUF012",
  "S101",
  "SIM102",
]
lint.isort.force-single-line = true

[tool.pytest]
ini_options.DJANGO_SETTINGS_MODULE = "config.settings"
ini_options.python_files = [ "test_*.py" ]

[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
ignore = "H006,H030,H031,T002,D018"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
css.indent_size = 2
js.indent_size = 2
