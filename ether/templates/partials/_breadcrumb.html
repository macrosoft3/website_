{# Renders a 2-level breadcrumb. Pass `label` (current page title) when including. #}
<nav class="breadcrumb"
     aria-label="{% if lang == 'en' %}Breadcrumb{% else %}パンくずリスト{% endif %}">
  <ol>
    <li>
      <a href="{% if lang == 'en' %}/en/{% else %}/{% endif %}">
        {% if lang == 'en' %}
          Home
        {% else %}
          ホーム
        {% endif %}
      </a>
    </li>
    <li aria-current="page">{{ label }}</li>
  </ol>
</nav>
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "{% if lang == 'en' %}Home{% else %}ホーム{% endif %}",
        "item": "https://ether-llc.com{% if lang == 'en' %}/en/{% else %}/{% endif %}"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "{{ label }}",
        "item": "https://ether-llc.com{{ request.path }}"
      }
    ]
  }
</script>
