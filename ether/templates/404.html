{% extends "base.html" %}

{% block title %}
  404 | Ether合同会社
{% endblock title %}
{% block content %}
  <section>
    <h1>404 — ページが見つかりません</h1>
    <p>
      {% if exception %}
        {{ exception }}
      {% else %}
        お探しのページは移動または削除された可能性があります。URL をご確認のうえ、もう一度お試しください。
      {% endif %}
    </p>
    <p>
      <a href="{% url 'home' %}">ホーム</a> / <a href="{% url 'contact' %}">お問い合わせ</a>
    </p>
  </section>
{% endblock content %}
